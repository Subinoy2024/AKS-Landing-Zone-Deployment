# ==================================================================
# AIPP Terraform pipeline · provider hashicorp/azurerm + azurerm backend
# 4-stage flow: validate -> plan -> policy -> apply
# `apply` is guarded by a HarnessApproval step + branch/tag rule.
# ==================================================================
pipeline:
  name: AIPP-Terraform-AKS-Landing-Zone-Deployment
  identifier: AIPP_TF_AKS_Landing_Zone_Deployment
  projectIdentifier: <+variable.HARNESS_PROJECT>
  orgIdentifier: <+variable.HARNESS_ORG>
  variables:
  - name: TF_ROOT
    type: String
    value: .
  - name: TF_VERSION
    type: String
    value: 1.9.5
  - name: TF_BACKEND_KEY
    type: String
    value: AKS-Landing-Zone-Deployment.tfstate
  - name: TF_ARTIFACT_STORE
    type: String
    value: <+input>
  - name: TF_APPROVER_GROUP
    type: String
    value: <+input>
  - name: HARNESS_ORG
    type: String
    value: default
  - name: HARNESS_PROJECT
    type: String
    value: default
  stages:
  - stage:
      # -----------------------------------------------------------
      # STAGE 1 · VALIDATE — fmt + init + validate + tflint + tfsec
      # -----------------------------------------------------------
      identifier: terraform_validate
      name: Validate (provider hashicorp/azurerm + azurerm backend)
      type: Custom
      spec:
        execution:
          steps:
          - step:
              identifier: install_terraform
              name: Install Terraform
              type: Run
              spec:
                shell: Bash
                command: curl -fsSLo /tmp/tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION:-1.9.5}/terraform_${TF_VERSION:-1.9.5}_linux_amd64.zip"
                  && unzip -o /tmp/tf.zip -d /usr/local/bin/ && terraform version
          - step:
              identifier: install_tflint
              name: Install Tflint
              type: Run
              spec:
                shell: Bash
                command: curl -sSL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          - step:
              identifier: install_tfsec
              name: Install Tfsec
              type: Run
              spec:
                shell: Bash
                command: curl -sSL https://tfsec.dev/install.sh | bash
          - step:
              identifier: cloud_auth
              name: Cloud Auth
              type: Run
              spec:
                shell: Bash
                command: az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
          - step:
              identifier: terraform_fmt_init_validate
              name: Terraform Fmt Init Validate
              type: Run
              spec:
                shell: Bash
                command: 'cd "${TF_ROOT:-.}"

                  terraform fmt -check -recursive

                  terraform init -input=false -backend-config=key=${TF_BACKEND_KEY:-terraform.tfstate}

                  terraform validate'
          - step:
              identifier: tflint
              name: Tflint
              type: Run
              spec:
                shell: Bash
                command: 'cd "${TF_ROOT:-.}"

                  tflint --init && tflint --format=default --recursive'
          - step:
              identifier: tfsec
              name: Tfsec
              type: Run
              spec:
                shell: Bash
                command: 'cd "${TF_ROOT:-.}"

                  tfsec . --format=lovely --soft-fail-warnings'
  - stage:
      # -----------------------------------------------------------
      # STAGE 2 · PLAN — publishes tfplan artefact via File Store
      # -----------------------------------------------------------
      identifier: terraform_plan
      name: Plan (native TerraformPlan step)
      type: Custom
      spec:
        execution:
          steps:
          - step:
              type: TerraformPlan
              name: Terraform Plan
              identifier: terraform_plan_step
              spec:
                provisionerIdentifier: aipp_infra
                configuration:
                  command: Apply
                  configFiles:
                    store:
                      type: Github
                      spec:
                        connectorRef: <+input>
                        gitFetchType: Branch
                        branch: <+trigger.branch>
                        folderPath: <+pipeline.variables.TF_ROOT>
                  backendConfig:
                    type: Inline
                    spec:
                      content: key = "<+pipeline.variables.TF_BACKEND_KEY>"
                  environmentVariables: []
                  varFiles: []
                  targets: []
                delegateSelectors:
                - <+input>
              timeout: 15m
  - stage:
      # -----------------------------------------------------------
      # STAGE 3 · POLICY — OPA/conftest + Terratest (soft-fail)
      # -----------------------------------------------------------
      identifier: terraform_policy
      name: Policy (OPA / conftest + Terratest)
      type: Custom
      spec:
        execution:
          steps:
          - step:
              identifier: install_conftest
              name: Install Conftest
              type: Run
              spec:
                shell: Bash
                command: wget -qO /tmp/conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz
                  && tar -xzf /tmp/conftest.tar.gz -C /tmp && mv /tmp/conftest /usr/local/bin/
          - step:
              identifier: opa_conftest_gate
              name: Opa Conftest Gate
              type: Run
              spec:
                shell: Bash
                command: "cd \"${TF_ROOT:-.}\"\nif [ -d policy ]; then\n  conftest test plan.json --policy policy\nelse\n  echo 'No ./policy directory\
                  \ found \u2014 skipping OPA gate'\nfi"
          - step:
              identifier: terratest_if_present
              name: Terratest If Present
              type: Run
              spec:
                shell: Bash
                command: "cd \"${TF_ROOT:-.}\"\nif [ -d tests ] && ls tests/*.go >/dev/null 2>&1; then\n  go test -v -timeout 60m ./tests/...\n\
                  else\n  echo 'No Terratest suite under ./tests \u2014 skipping'\nfi"
  - stage:
      # -----------------------------------------------------------
      # STAGE 4 · APPLY — HarnessApproval step gates apply until a
      # designated approver clicks Approve; also branch/tag guarded.
      # -----------------------------------------------------------
      identifier: terraform_apply
      name: "Apply (native TerraformApply \xB7 manual approval)"
      type: Custom
      spec:
        execution:
          steps:
          - step:
              identifier: terraform_apply_approval
              name: Approve Terraform apply
              type: HarnessApproval
              timeout: 1d
              spec:
                approvalMessage: Review the plan output above and approve terraform apply to production.
                includePipelineExecutionHistory: true
                approvers:
                  minimumCount: 1
                  disallowPipelineExecutor: true
                  userGroups:
                  - <+variable.TF_APPROVER_GROUP>
          - step:
              type: TerraformApply
              name: Terraform Apply (inherit from plan)
              identifier: terraform_apply_step
              spec:
                provisionerIdentifier: aipp_infra
                configuration:
                  type: InheritFromPlan
              timeout: 60m
        environment:
          environmentRef: production
      when:
        pipelineStatus: Success
        condition: <+trigger.branch> == 'main' || <+trigger.tag>.startsWith('v')
