# .azure-pipelines/azure-pipelines.yml
trigger:
  branches:
    include:
    - main
  paths:
    include:
    - '**/*.tf'
    - '**/*.tfvars'
    - 'modules/**'
    - 'environments/**'

pr: none   # PR pipeline is separate

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: environment
  displayName: 'Target Environment'
  type: string
  default: 'dev'
  values:
  - dev
  - qa
  - prod

variables:
  tfVersion: '1.9.0'
  workingDirectory: '$(Build.SourcesDirectory)'
  environmentName: ${{ parameters.environment }}
  backendRG: 'REVA-RACE-PROJECT-ACCESS'
  backendStorage: 'devopsracerevaprodccloud'
  backendContainer: 'revaprotfstate'

stages:

# ========================================
# STAGE 1: Validate & Plan (Always runs)
# ========================================
- stage: ValidateAndPlan
  displayName: 'Validate & Plan'
  jobs:
  - job: ValidatePlan
    displayName: 'Terraform Validate & Plan'
    steps:

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: $(tfVersion)

    - task: Bash@3
      displayName: 'Terraform Format Check'
      inputs:
        targetType: 'inline'
        script: terraform fmt -check -recursive
        workingDirectory: $(workingDirectory)
      failOnStderr: true

    - task: TerraformTaskV2@2
      displayName: 'Terraform Init'
      inputs:
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: 'AzureServiceConnection'
        backendAzureRmResourceGroupName: $(backendRG)
        backendAzureRmStorageAccountName: $(backendStorage)
        backendAzureRmContainerName: $(backendContainer)
        backendAzureRmKey: 'aks-lz/$(environmentName)/terraform.tfstate'

    - task: TerraformTaskV2@2
      displayName: 'Terraform Validate'
      inputs:
        command: 'validate'
        workingDirectory: '$(workingDirectory)'

    - task: trivy@1
      displayName: 'Trivy IaC Scan'
      inputs:
        scanType: 'fs'
        scanPath: '.'
        format: 'table'
        exitCode: '1'
        severity: 'HIGH,CRITICAL'

    - task: Bash@3
      displayName: 'Checkov Security Scan'
      inputs:
        targetType: 'inline'
        script: |
          pip install checkov
          checkov -d . --framework terraform --output cli --soft-fail
        workingDirectory: $(workingDirectory)
      failOnStderr: false

    - task: TerraformTaskV2@2
      displayName: 'Terraform Plan'
      inputs:
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        environmentServiceName: 'AzureServiceConnection'
        commandOptions: '-var-file=environments/$(environmentName)/terraform.tfvars -out=tfplan'
        publishPlanResults: 'Terraform Plan - $(environmentName)'

    - publish: '$(workingDirectory)/tfplan'
      artifact: 'tfplan-$(environmentName)'
      displayName: 'Publish Plan Artifact'

# ========================================
# STAGE 2: Manual Approval (QA & Prod only)
# ========================================
- stage: Approval
  displayName: 'Manual Approval'
  dependsOn: ValidateAndPlan
  condition: and(succeeded(), ne(variables.environmentName, 'dev'))
  jobs:
  - deployment: ApprovalGate
    displayName: 'Approval for ${{ parameters.environment }}'
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - task: ManualValidation@0
            inputs:
              notifyUsers: ''   # Add approver emails here
              instructions: 'Review Terraform Plan for ${{ parameters.environment }} before deployment.'

# ========================================
# STAGE 3: Apply (Deployment)
# ========================================
- stage: Deploy
  displayName: 'Deploy to ${{ parameters.environment }}'
  dependsOn: Approval
  condition: succeeded()
  jobs:
  - deployment: TerraformApply
    displayName: 'Terraform Apply'
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(tfVersion)

          - download: current
            artifact: 'tfplan-$(environmentName)'

          - task: TerraformTaskV2@2
            displayName: 'Terraform Init (Apply)'
            inputs:
              command: 'init'
              workingDirectory: '$(workingDirectory)'
              backendServiceArm: 'AzureServiceConnection'
              backendAzureRmResourceGroupName: $(backendRG)
              backendAzureRmStorageAccountName: $(backendStorage)
              backendAzureRmContainerName: $(backendContainer)
              backendAzureRmKey: 'aks-lz/$(environmentName)/terraform.tfstate'

          - task: TerraformTaskV2@2
            displayName: 'Terraform Apply'
            inputs:
              command: 'apply'
              workingDirectory: '$(workingDirectory)'
              environmentServiceName: 'AzureServiceConnection'
              commandOptions: '-auto-approve tfplan'